name: CI
on: workflow_dispatch   # manual only: GitHub → Actions → CI → Run workflow
permissions:
  contents: read     # read your code (checkout)
  checks: write      # post Theme Check results
jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          token: ${{ github.token }}
